server:
  port: ${PORT:8080}

spring:
  application:
    name: FilthiLink




  datasource:
    url: jdbc:postgres://localhost:5432/filthiLinkDb
    username: filthi
    password: filthi_pass

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  google:
    client-id: ${CLIENT_ID}
    client-secret: ${CLIENT_SECRET}
  base-url: http://localhost:8080
  refresh-token:
    expiry: 7
  jwt:
    secret: ${JWT_SECRET}
    expiry: 900000


dodo:
  api-key: ${DODO_API_KEY}
  base-url: https://api.filthilink.store
  webhook-key: ${DODO_WEBHOOK_KEY}
  return-url: https://filthilink.store/subscription/success
  products:
    premium-monthly: ${PREMIUM_MONTHLY}
    premium-yearly: ${PREMIUM_YEARLY}